name: Test Secret Entrance Part 2

env:
  TARGET_DIR: './2025/01-secret-entrance/part-2/src'

on:
  pull_request:
    paths:
      - '2025/01-secret-entrance/part-2/**'
      - '.github/workflows/templates/dotnet-test/**'
      - '.github/workflows/2025/1-2-secret-entrance.yml'
  workflow_dispatch:

jobs:
  build:
    name: 'Build and Test'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run Dotnet Build and Test
        uses: ./.github/workflows/templates/dotnet-test
        with:
          target_dir: ${{ env.TARGET_DIR }}

      - name: Check Final Answer
        uses: ./.github/workflows/templates/final-answer
        with:
          target_dir: ${{ env.TARGET_DIR }}/SecretEntrance
          executable: dotnet run --no-build
          input_data: "../../input-data"
          expected_result: "Answer: 5831"
