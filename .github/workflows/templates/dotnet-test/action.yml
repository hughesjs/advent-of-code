name: Dotnet Build and Test
inputs:
  target_dir:
    description: 'Folder to run action against'
    required: true

runs:
  using: "composite"
  steps:
    - name: Set Up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run Tests
      shell: bash
      working-directory: ${{ inputs.target_dir }}
      run: dotnet test
